<style>
  :root{
    --verde-galpon:#1F3A2E;
    --verde-galpon-d:#152922;
    --crema:#F6F1E7;
    --amarillo:#E4A93A;
    --carbon:#2B2B26;
    --terracota:#B84B33;
    --verde-medio:#5C8567;
    --blanco:#FFFDF8;
    --linea:rgba(31,58,46,0.14);
    --sombra:0 2px 10px rgba(31,58,46,0.10);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--crema); color:var(--carbon); font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent; }
  .app{ max-width:780px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--crema); position:relative; }

  header.top{ background:var(--verde-galpon); color:var(--crema); padding:18px 18px 16px; position:relative; overflow:hidden; }
  header.top::before{ content:""; position:absolute; inset:0; background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 14px); pointer-events:none; }
  .stamp{ display:inline-flex; align-items:center; gap:10px; }
  .stamp .badge{ border:2px solid var(--amarillo); color:var(--amarillo); font-family:'Oswald',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; padding:3px 7px; border-radius:3px; transform:rotate(-3deg); }
  h1.brand{ font-family:'Oswald',sans-serif; font-weight:700; font-size:22px; letter-spacing:1.5px; text-transform:uppercase; margin:8px 0 2px; }
  .brand-sub{ font-size:12.5px; color:rgba(246,241,231,0.72); letter-spacing:0.3px; }

  nav.tabs{ position:sticky; bottom:0; z-index:20; display:flex; background:var(--verde-galpon-d); border-top:1px solid rgba(255,255,255,0.08); }
  nav.tabs button{ flex:1; background:transparent; border:none; color:rgba(246,241,231,0.55); font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:12px 4px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; letter-spacing:0.2px; }
  nav.tabs button.active{ color:var(--amarillo); }
  nav.tabs button .dot{ width:5px;height:5px;border-radius:50%; background:var(--amarillo); opacity:0; transition:opacity .15s; }
  nav.tabs button.active .dot{ opacity:1; }
  nav.tabs svg{ width:20px; height:20px; }

  main{ flex:1; padding:16px 16px 24px; }
  .section-title{ font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; letter-spacing:0.5px; text-transform:uppercase; color:var(--verde-galpon); margin:0 0 10px; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .section-title .tag{ font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--verde-galpon); color:var(--crema); padding:2px 6px; border-radius:3px; letter-spacing:0; }

  .grupo{ margin-bottom:18px; }
  .grupo-label{ font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--verde-galpon); opacity:0.65; font-weight:700; margin:0 0 8px 2px; }
  .grid-puestos{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card-puesto{ background:var(--blanco); border:1px solid var(--linea); border-radius:10px; padding:13px 12px; cursor:pointer; box-shadow:var(--sombra); transition:transform .1s, border-color .1s; text-align:left; }
  .card-puesto:active{ transform:scale(0.97); }
  .card-puesto.selected{ border-color:var(--amarillo); background:#FFF9EC; }
  .card-puesto .nombre{ font-weight:700; font-size:13.5px; color:var(--carbon); display:block; margin-bottom:3px; }
  .card-puesto .meta{ font-size:10.5px; color:var(--verde-galpon); opacity:0.7; }

  .panel{ background:var(--blanco); border:1px solid var(--linea); border-radius:12px; padding:16px; box-shadow:var(--sombra); margin-top:10px; }
  label.f{ display:block; font-size:12px; font-weight:600; color:var(--verde-galpon); margin:14px 0 5px; letter-spacing:0.2px; }
  label.f:first-child{ margin-top:0; }
  input[type=text], input[type=number], input[type=date], select, textarea{ width:100%; padding:11px 12px; border:1.5px solid var(--linea); border-radius:8px; font-family:'Inter',sans-serif; font-size:14.5px; background:#fff; color:var(--carbon); transition:border-color .15s, background .15s; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--verde-galpon); }
  textarea{ resize:vertical; min-height:56px; }
  .fila2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn{ font-family:'Inter',sans-serif; font-weight:700; font-size:14px; padding:13px 18px; border-radius:9px; border:none; cursor:pointer; letter-spacing:0.2px; }
  .btn-primario{ background:var(--verde-galpon); color:var(--crema); width:100%; margin-top:18px; }
  .btn-primario:active{ background:var(--verde-galpon-d); }
  .btn-secundario{ background:transparent; color:var(--verde-galpon); border:1.5px solid var(--verde-galpon); }
  .btn-peligro{ background:transparent; color:var(--terracota); border:1.5px solid var(--terracota); }

  /* estado en vivo del campo */
  input.estado-ok{ border-color:var(--verde-medio); background:#F3F8F4; }
  input.estado-alerta{ border-color:var(--amarillo); background:#FFF8EA; }
  input.estado-critico{ border-color:var(--terracota); background:#FDF0EC; }
  .estado-txt{ font-size:11px; font-weight:600; margin-top:4px; display:block; min-height:14px; }
  .estado-txt.ok{ color:var(--verde-medio); }
  .estado-txt.alerta{ color:#B8863A; }
  .estado-txt.critico{ color:var(--terracota); }

  .toast{ position:fixed; bottom:78px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--verde-galpon); color:var(--amarillo); padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.25); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:50; max-width:88%; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .trab-item{ display:flex; align-items:center; justify-content:space-between; background:var(--blanco); border:1px solid var(--linea); border-radius:9px; padding:11px 13px; margin-bottom:8px; }
  .trab-item .nombre{ font-weight:700; font-size:14px; }
  .trab-item .sub{ font-size:11px; color:var(--verde-galpon); opacity:0.7; }
  .chip{ font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; background:var(--crema); color:var(--verde-galpon); margin-left:6px; }
  .icon-btn{ background:transparent; border:none; cursor:pointer; color:var(--terracota); padding:6px; }

  select.selector-puesto{ font-weight:700; color:var(--verde-galpon); margin-bottom:12px; width:100%; }

  .filtros-bar{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .filtro-btn{ background:var(--blanco); border:1.5px solid var(--linea); color:var(--verde-galpon); font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:20px; cursor:pointer; }
  .filtro-btn.active{ background:var(--verde-galpon); color:var(--crema); border-color:var(--verde-galpon); }

  .lav-resumen-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
  .lav-resumen-card{ background:var(--blanco); border:1px solid var(--linea); border-radius:10px; padding:10px 12px; }
  .lav-resumen-card .num{ font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:var(--verde-galpon); }
  .lav-resumen-card .lbl{ font-size:10.5px; color:var(--carbon); opacity:0.65; letter-spacing:0.2px; }
  .tabla-lav{ width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; }
  .tabla-lav th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.3px; color:var(--verde-galpon); opacity:0.75; padding:6px 6px; border-bottom:1.5px solid var(--linea); }
  .tabla-lav td{ padding:8px 6px; border-bottom:1px solid var(--linea); vertical-align:top; }
  .tabla-lav tr:last-child td{ border-bottom:none; }
  .lav-obs{ font-size:11px; color:var(--carbon); opacity:0.65; }
  .lav-por-trabajador{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--linea); font-size:12.5px; }
  .lav-por-trabajador:last-child{ border-bottom:none; }
  .lav-por-trabajador b{ font-family:'JetBrains Mono',monospace; }

  .toggle-vista{ display:flex; background:var(--blanco); border:1px solid var(--linea); border-radius:10px; padding:3px; margin-bottom:14px; }
  .toggle-vista button{ flex:1; background:transparent; border:none; padding:9px; font-size:12.5px; font-weight:700; color:var(--verde-galpon); opacity:0.55; border-radius:8px; cursor:pointer; }
  .toggle-vista button.active{ background:var(--verde-galpon); color:var(--amarillo); opacity:1; }

  .resumen-cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .resumen-card{ background:var(--verde-galpon); border-radius:10px; padding:12px 14px; color:var(--crema); }
  .resumen-card .num{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:var(--amarillo); }
  .resumen-card .lbl{ font-size:10.5px; opacity:0.75; letter-spacing:0.3px; }

  .rank-card{ background:var(--blanco); border:1px solid var(--linea); border-left:5px solid var(--verde-medio); border-radius:10px; padding:13px 14px; margin-bottom:10px; box-shadow:var(--sombra); }
  .rank-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .rank-medal{ font-size:16px; width:22px; text-align:center; }
  .rank-nombre{ font-weight:700; font-size:14.5px; flex:1; }
  .rank-n{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--verde-galpon); opacity:0.6; }
  .rank-valor{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:26px; line-height:1; margin:4px 0 6px; }
  .rank-valor .u{ font-size:14px; opacity:0.7; margin-left:2px; }
  .rank-bar-bg{ background:var(--crema); border-radius:6px; height:8px; overflow:hidden; }
  .rank-bar-fill{ height:100%; border-radius:6px; transition:width .4s; }
  .rank-label{ font-size:11px; color:var(--carbon); opacity:0.65; margin-top:5px; }

  .hist-fecha{ font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--verde-galpon); margin:16px 0 8px; display:flex; align-items:center; gap:8px; }
  .hist-fecha:first-child{ margin-top:0; }
  .hist-fecha .cnt{ font-family:'JetBrains Mono',monospace; font-size:10px; background:var(--verde-galpon); color:var(--crema); padding:1px 6px; border-radius:10px; }
  .hist-item{ background:var(--blanco); border:1px solid var(--linea); border-radius:10px; padding:11px 13px; margin-bottom:8px; }
  .hist-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  .hist-nombre{ font-weight:700; font-size:13.5px; }
  .hist-campos{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:5px; }
  .hist-chip{ font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; display:flex; gap:4px; align-items:center; }
  .hist-chip.ok{ background:#EEF5EF; color:var(--verde-medio); }
  .hist-chip.alerta{ background:#FFF6E4; color:#B8863A; }
  .hist-chip.critico{ background:#FBEAE5; color:var(--terracota); }
  .hist-chip.neutro{ background:var(--crema); color:var(--carbon); opacity:0.75; }
  .hist-notas{ font-size:11.5px; color:var(--carbon); opacity:0.75; font-style:italic; margin-top:4px; }

  .vacio{ text-align:center; padding:40px 20px; color:var(--verde-galpon); opacity:0.55; font-size:13.5px; }
  .empty-icon{ font-size:34px; display:block; margin-bottom:8px; }
  .loading-line{ text-align:center; padding:30px; color:var(--verde-galpon); font-size:13px; opacity:0.6; }

  #printable-tablero{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #printable-tablero, #printable-tablero *{ visibility:visible; }
    #printable-tablero{ position:absolute; left:0; top:0; width:100%; display:block; padding:20px; font-family:Arial,sans-serif; color:#000; }
    #printable-tablero h1{ font-size:20px; color:#1F3A2E; margin-bottom:2px; }
    #printable-tablero h2{ font-size:14px; color:#B8863A; margin-top:0; }
    #printable-tablero table{ width:100%; border-collapse:collapse; margin-top:14px; }
    #printable-tablero th, #printable-tablero td{ border:1px solid #ccc; padding:6px 8px; text-align:left; font-size:12px; }
    #printable-tablero th{ background:#1F3A2E; color:#fff; }
  }
</style>
</head>

function puestoPorId(id){ return PUESTOS.find(p=>p.id===id); }

function indicadorPonderado(){
  return {
    tipo:'ponderado',
    principal:{ tipo:'paradas_score', campo:'paradas_banda', label:'Destreza (sin paradas de banda)', invertido:false, unidad:'%' },

    principal:{ tipo:'paradas_score', campo:'paradas_banda', label:'Destreza (sin paradas por atraso)', invertido:false, unidad:'%' },
    secundario:{ tipo:'paradas_score', campo:'errores_reporte', label:'Calidad de información (calibre/color)', invertido:false, unidad:'%' },

function getIndicadorPrincipal(p){
  switch(p.id){
    case 'pileta': return {tipo:'razon_fija', num:'bines_hora', metaFija:META_BINES_HORA, label:'Cumplimiento meta bines/hora', invertido:false, unidad:'%'};
    case 'seleccion': return {tipo:'razon', num:'frutas_correctas', den:'frutas_auditadas', label:'Precisión de clasificación', invertido:false, unidad:'%'};
    case 'guapita_afuera': case 'baby_afuera': return indicadorPonderado();
    case 'peso': return indicadorPonderadoPeso();
    case 'lavado_canastas': return {tipo:'razon', num:'canastas_lavadas', den:'meta_dia', label:'Cumplimiento de meta', invertido:false, unidad:'%'};
    case 'primera': case 'segunda': case 'guapita_industria': case 'tercera_baby': case 'pedidos_especiales':
      return indicadorPonderado();
    default: return {tipo:'promedio', campo:'estibas', label:'Estibas completadas (prom.)', invertido:false, unidad:''};
  }
}

// Convierte el conteo de paradas en un puntaje de cumplimiento (%),
// siguiendo el semáforo acordado: 0-1 = verde, 2 = naranja, 3+ = rojo.
function paradasAPorcentaje(n){
  if(n<=0) return 100;
  if(n===1) return 88;
  if(n===2) return 55;
  return Math.max(0, 25 - (n-3)*10);
}

/* ======================= STORAGE (Google Sheets) ======================= */
// Esta app guarda y lee todo desde una hoja de Google Sheets, a través de un
// pequeño backend hecho con Google Apps Script. Así funciona sin importar
// desde dónde se abra el archivo (Claude, GitHub Pages, o un archivo suelto).
const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbya7R2fcUu5yPi85eL7cPbzfSweTgv2NQNLmy5BNDmVifGUOOjrcvMcYq2KunwsW-X-ZQ/exec';
const PREFIJO_LOCAL = 'guapa_desempeno_'; // solo como copia de respaldo si falla internet

function trabajadoresSemilla(){
  return TRABAJADORES_SEMILLA.map((t,i)=>({id:'t'+i+'_'+Date.now(), ...t}));
}

function guardarCacheLocal(){
  try{
    localStorage.setItem(PREFIJO_LOCAL+'trabajadores', JSON.stringify(trabajadores));
    localStorage.setItem(PREFIJO_LOCAL+'muestreos', JSON.stringify(muestreos));
    localStorage.setItem(PREFIJO_LOCAL+'lavados', JSON.stringify(lavados));
  }catch(e){}
}

async function guardarEnNube(){
  try{
    const res = await fetch(URL_BACKEND, { method:'POST', body: JSON.stringify({ accion:'guardarTodo', trabajadores, muestreos, lavados }) });
    const data = await res.json();
    if(data && data.ok){ guardarCacheLocal(); return { ok:true }; }
    return { ok:false, error: (data && data.error) ? data.error : 'El servidor no confirmó el guardado.' };
  }catch(e){
    return { ok:false, error: 'No se pudo conectar con la hoja de Google. Revisa tu conexión a internet.' };
  }
}
async function guardarTrabajadores(){ return await guardarEnNube(); }
async function guardarMuestreos(){ return await guardarEnNube(); }
async function guardarLavados(){ return await guardarEnNube(); }

async function cargarDatos(){
  try{
    const res = await fetch(URL_BACKEND + '?accion=obtenerTodo');
    const data = await res.json();
    trabajadores = data.trabajadores || [];
    muestreos = data.muestreos || [];
    lavados = data.lavados || [];
    if(trabajadores.length===0 && muestreos.length===0){
      trabajadores = trabajadoresSemilla();
      await guardarEnNube();
    }
    guardarCacheLocal();
  }catch(e){
    try{
      trabajadores = JSON.parse(localStorage.getItem(PREFIJO_LOCAL+'trabajadores')) || trabajadoresSemilla();
      muestreos = JSON.parse(localStorage.getItem(PREFIJO_LOCAL+'muestreos')) || [];
      lavados = JSON.parse(localStorage.getItem(PREFIJO_LOCAL+'lavados')) || [];
    }catch(err){
      trabajadores = trabajadoresSemilla();
      muestreos = [];
      lavados = [];
    }
    cargando = false;
    render();
    mostrarError('Sin conexión con la hoja de Google. Mostrando la última copia guardada en este dispositivo.');
    return;
  }
  cargando = false;
  render();
}

function inicializarRangoGeneral(tipo){
  const hoy = new Date();
  if(tipo==='semana'){
    const dia = hoy.getDay(); // 0=domingo
    const diffLunes = dia===0 ? -6 : 1-dia;
    const lunes = new Date(hoy); lunes.setDate(hoy.getDate()+diffLunes);
    const domingo = new Date(lunes); domingo.setDate(lunes.getDate()+6);
    rangoGeneral = { tipo:'semana', desde:hoyISOde(lunes), hasta:hoyISOde(domingo) };
  }else if(tipo==='mes'){
    const primero = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    const ultimo = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0);
    rangoGeneral = { tipo:'mes', desde:hoyISOde(primero), hasta:hoyISOde(ultimo) };
  }else{
    rangoGeneral.tipo = 'personalizado';
  }
}
function hoyISOde(d){ return d.toISOString().slice(0,10); }

function calcularTableroGeneral(desde, hasta){
  const enRango = muestreos.filter(m=> m.fecha>=desde && m.fecha<=hasta);
  const porTrabajador = {};
  enRango.forEach(m=>{ (porTrabajador[m.trabajadorId]=porTrabajador[m.trabajadorId]||[]).push(m); });

  const resultado = Object.keys(porTrabajador).map(tid=>{
    const t = trabajadores.find(tt=>tt.id===tid);
    const regsTrab = porTrabajador[tid];
    const porPuesto = {};
    regsTrab.forEach(r=>{ (porPuesto[r.puestoId]=porPuesto[r.puestoId]||[]).push(r); });

    const detalle = Object.keys(porPuesto).map(pid=>{
      const p = puestoPorId(pid);
      const ind = getIndicadorPrincipal(p);
      const valor = valorAgregadoTrabajador(p, ind, porPuesto[pid]);
      return { puesto:p.nombre, unidad:ind.unidad, valor, esPorcentaje: ind.unidad==='%', registros: porPuesto[pid].length };
    });

    const conPorcentaje = detalle.filter(d=>d.esPorcentaje && d.valor!==null);
    const compuesto = conPorcentaje.length ? conPorcentaje.reduce((a,b)=>a+b.valor,0)/conPorcentaje.length : null;

    return {
      nombre: t? t.nombre : '(eliminado)',
      compuesto,
      detalle,
      totalRegistros: regsTrab.length,
      puestosDistintos: Object.keys(porPuesto).length
    };
  });

  resultado.sort((a,b)=>{
    if(a.compuesto===null && b.compuesto===null) return b.totalRegistros - a.totalRegistros;
    if(a.compuesto===null) return 1;
    if(b.compuesto===null) return -1;
    return b.compuesto - a.compuesto;
  });
  return resultado;
}

function estadoDeValor(polaridad, valor, extra){
  extra = extra || {};
  const estricto = extra.estricto;
  const escalaParadas = extra.escalaParadas;
  const meta = extra.meta;
  const v = Number(valor);
  if(polaridad==='neutro' || isNaN(v)) return {clase:'neutro', txt:''};
  if(polaridad==='malo_alto'){
    if(escalaParadas){
      if(v<=1) return {clase:'ok', txt:'✅ '+v+' — dentro de lo normal'};
      if(v===2) return {clase:'alerta', txt:'⚠️ 2 — revisar'};
      return {clase:'critico', txt:'🔴 '+v+' — nivel alto, requiere atención'};
    }
    if(v<=0) return {clase:'ok', txt:'✅ Sin novedades'};
    if(estricto) return {clase:'critico', txt:'🔴 Objetivo de este puesto es cero: hubo '+v+' novedad(es)'};
    if(v<=2) return {clase:'alerta', txt:'⚠️ Revisar, hubo '+v+' novedad(es)'};
    return {clase:'critico', txt:'🔴 Atención: '+v+' novedades'};
  }
  // bueno_alto
  if(meta){
    if(v<=0) return {clase:'critico', txt:'🔴 Sin registro (meta '+meta+')'};
    if(v>=meta) return {clase:'ok', txt:'✅ Cumplió la meta ('+v+'/'+meta+')'};
    if(v>=meta*0.75) return {clase:'alerta', txt:'⚠️ Por debajo de la meta: '+v+'/'+meta};
    return {clase:'critico', txt:'🔴 Muy por debajo de la meta: '+v+'/'+meta};
  }
  if(v<=0) return {clase:'alerta', txt:'⚠️ Sin registro de producción'};
  return {clase:'ok', txt:'✅ Registrado'};
}

/* ======================= LAVADO DE CANASTAS: HELPERS ======================= */
function inicioSemanaDe(d){
  const dia = d.getDay();
  const diffLunes = dia===0 ? -6 : 1-dia;
  const lunes = new Date(d); lunes.setDate(d.getDate()+diffLunes);
  lunes.setHours(0,0,0,0);
  return lunes;
}
function finSemanaDe(d){
  const lunes = inicioSemanaDe(d);
  const domingo = new Date(lunes); domingo.setDate(lunes.getDate()+6);
  return domingo;
}
function rangoLavadoActivo(){
  const ref = new Date((filtroLavado.fecha || hoyISO())+'T00:00:00');
  if(filtroLavado.modo==='dia'){
    const iso = filtroLavado.fecha || hoyISO();
    return { desde:iso, hasta:iso, etiqueta: fechaCorta(iso) };
  }
  if(filtroLavado.modo==='semana'){
    const desde = hoyISOde(inicioSemanaDe(ref)), hasta = hoyISOde(finSemanaDe(ref));
    return { desde, hasta, etiqueta: `Semana del ${fechaCorta(desde)}` };
  }
  if(filtroLavado.modo==='mes'){
    const primero = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const ultimo = new Date(ref.getFullYear(), ref.getMonth()+1, 0);
    const desde = hoyISOde(primero), hasta = hoyISOde(ultimo);
    return { desde, hasta, etiqueta: ref.toLocaleDateString('es-CO',{month:'long', year:'numeric'}) };
  }
  return { desde:null, hasta:null, etiqueta:'Todo el histórico' };
}
function calcularFiltroLavado(){
  const { desde, hasta } = rangoLavadoActivo();
  return lavados.filter(l=>{
    if(desde && l.fecha < desde) return false;
    if(hasta && l.fecha > hasta) return false;
    if(filtroLavado.personaId && l.trabajadorId !== filtroLavado.personaId) return false;
    return true;
  }).sort((a,b)=> b.fecha.localeCompare(a.fecha) || (b.creado||0)-(a.creado||0));
}
function calcularResumenLavado(lista){
  const total = lista.reduce((s,l)=>s+(Number(l.cantidad)||0),0);
  const totalRechazos = lista.reduce((s,l)=>s+(Number(l.rechazos)||0),0);
  const diasUnicos = new Set(lista.map(l=>l.fecha));
  const dias = diasUnicos.size;
  const promedio = dias>0 ? total/dias : 0;
  const porTrabajador = {};
  lista.forEach(l=>{
    const key = l.trabajadorId || '_sin';
    if(!porTrabajador[key]) porTrabajador[key] = { cantidad:0, rechazos:0 };
    porTrabajador[key].cantidad += (Number(l.cantidad)||0);
    porTrabajador[key].rechazos += (Number(l.rechazos)||0);
  });
  const ranking = Object.entries(porTrabajador).map(([id,v])=>{
    const t = trabajadores.find(x=>x.id===id);
    return { nombre: t ? t.nombre : 'Sin nombre', cantidad:v.cantidad, rechazos:v.rechazos,
      pctRechazo: v.cantidad>0 ? (v.rechazos/v.cantidad*100) : 0 };
  }).sort((a,b)=>b.cantidad-a.cantidad);
  const rankingRechazos = ranking.filter(r=>r.rechazos>0).slice().sort((a,b)=>b.pctRechazo-a.pctRechazo);
  return { total, totalRechazos, dias, promedio, ranking, rankingRechazos };
}

function filtrarPorRango(regs){
  if(rangoActual==='todo') return regs;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  let dias = rangoActual==='hoy' ? 0 : rangoActual==='7d' ? 6 : 29;
  const limite = new Date(hoy); limite.setDate(limite.getDate()-dias);
  return regs.filter(r=>{
    const f = new Date(r.fecha+'T00:00:00');
    return f>=limite;
  });
}

function relleno(v){ return v!==undefined && v!==null && v!==''; }

function valorAgregadoTrabajador(p, ind, regs){
  if(ind.tipo==='razon'){
    let num=0, den=0, n=0;
    regs.forEach(r=>{
      if(relleno(r.valores[ind.num]) && relleno(r.valores[ind.den])){
        num += Number(r.valores[ind.num]); den += Number(r.valores[ind.den]); n++;
      }
    });
    return (n>0 && den>0) ? (num/den*100) : null;
  }
  if(ind.tipo==='razon_fija'){
    let num=0, n=0;
    regs.forEach(r=>{ if(relleno(r.valores[ind.num])){ num += Number(r.valores[ind.num]); n++; } });
    return n>0 ? (num/(ind.metaFija*n)*100) : null;
  }
  if(ind.tipo==='paradas_score'){
    const puntajes = regs.map(r=>r.valores[ind.campo]).filter(relleno).map(v=>paradasAPorcentaje(Number(v)));
    return puntajes.length ? puntajes.reduce((a,b)=>a+b,0)/puntajes.length : null;
  }
  if(ind.tipo==='razon_calidad'){
    let malas=0, total=0, n=0;
    regs.forEach(r=>{
      if(relleno(r.valores[ind.num]) && relleno(r.valores[ind.den])){
        malas += Number(r.valores[ind.num]); total += Number(r.valores[ind.den]); n++;
      }
    });
    return (n>0 && total>0) ? ((total-malas)/total*100) : null;
  }
  if(ind.tipo==='ponderado'){
    const destreza = valorAgregadoTrabajador(p, ind.principal, regs);
    const calidad = valorAgregadoTrabajador(p, ind.secundario, regs);
    if(destreza===null && calidad===null) return null;
    if(destreza===null) return calidad;
    if(calidad===null) return destreza;
    return destreza*ind.pesoPrincipal + calidad*ind.pesoSecundario;
  }
  const vals = regs.map(r=>r.valores[ind.campo]).filter(relleno).map(Number);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}

function renderResultadoPuesto(){

      if(ind.tipo==='ponderado'){
        fila.destreza = valorAgregadoTrabajador(p, ind.principal, rs);
        fila.calidad = valorAgregadoTrabajador(p, ind.secundario, rs);
      }
      return fila;
    });
    let filas = todasLasFilas.filter(f=>f.valor!==null);

    filas.sort((a,b)=> ind.invertido ? a.valor-b.valor : b.valor-a.valor);
    const maxVal = Math.max(...filas.map(f=>f.valor), 1);
    const medallas = ['🥇','🥈','🥉'];

    let html = '';
    filas.forEach((f,i)=>{
      const pct = ind.invertido
        ? Math.max(6, 100 - (f.valor/maxVal)*94)

            <span style="display:flex; gap:4px;">
              <button class="icon-btn" data-edit-muestreo="${r.id}" title="Editar" style="color:var(--verde-galpon);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
              <button class="icon-btn" data-del-muestreo="${r.id}" title="Eliminar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 6"/></svg>
              </button>
            </span>
          </div>
          <div class="hist-campos">`;
        p.campos.forEach(c=>{
          const val = r.valores[c.key];
          if(val===undefined || val==='') return;
          const est = estadoDeValor(c.polaridad, val, { estricto: c.estricto, escalaParadas: c.escalaParadas, meta: c.metaObjetivo });
          const icono = est.clase==='ok'?'✅':est.clase==='alerta'?'⚠️':est.clase==='critico'?'🔴':'';
          html += `<span class="hist-chip ${est.clase}">${icono} ${c.label.split('(')[0].trim()}: ${val}</span>`;
        });
        html += `</div>`;
        if(r.notas) html += `<div class="hist-notas">"${r.notas}"</div>`;
        html += `</div>`;
      });
    });
    cont.innerHTML = html;
  }
}

/* ======================= EVENTOS ======================= */
function bindEventos(){
  document.querySelectorAll('[data-puesto]').forEach(el=>{
    el.onclick = ()=>{ puestoSeleccionado = el.dataset.puesto; render(); };
  });
  const btnGuardar = document.getElementById('btn-guardar-muestreo');
  if(btnGuardar) btnGuardar.onclick = onGuardarMuestreo;

  function evaluarCampo(el){
    const pol = el.dataset.pol;
    const est = estadoDeValor(pol, el.value, { estricto: el.dataset.estricto==='1', escalaParadas: el.dataset.escalaParadas==='1', meta: el.dataset.meta ? Number(el.dataset.meta) : null });
    el.classList.remove('estado-ok','estado-alerta','estado-critico');
    if(est.clase==='ok') el.classList.add('estado-ok');
    if(est.clase==='alerta') el.classList.add('estado-alerta');
    if(est.clase==='critico') el.classList.add('estado-critico');
    const lbl = document.getElementById('estado-'+el.id.replace('f-',''));
    if(lbl){ lbl.textContent = est.txt; lbl.className = 'estado-txt '+est.clase; }
  }
  document.querySelectorAll('input[data-pol]').forEach(el=>{
    el.addEventListener('input', ()=>evaluarCampo(el));
    if(el.value!=='') evaluarCampo(el);
  });

  const btnAddTrab = document.getElementById('btn-add-trab');
  if(btnAddTrab) btnAddTrab.onclick = onAgregarTrabajador;
  document.querySelectorAll('[data-del-trab]').forEach(el=>{ el.onclick = ()=>onEliminarTrabajador(el.dataset.delTrab); });

  const selRes = document.getElementById('sel-resultado-puesto');
  if(selRes) selRes.onchange = ()=>{ puestoResultado = selRes.value || null; render(); };

  document.querySelectorAll('[data-rango]').forEach(el=>{
    el.onclick = ()=>{ rangoActual = el.dataset.rango; render(); };
  });
  document.querySelectorAll('[data-vista]').forEach(el=>{
    el.onclick = ()=>{ vistaResultado = el.dataset.vista; render(); };
  });
  document.querySelectorAll('[data-del-muestreo]').forEach(el=>{
    el.onclick = ()=>onEliminarMuestreo(el.dataset.delMuestreo);
  });
  document.querySelectorAll('[data-edit-muestreo]').forEach(el=>{
    el.onclick = ()=>{
      const m = muestreos.find(x=>x.id===el.dataset.editMuestreo);
      if(!m) return;
      editandoId = m.id;
      puestoSeleccionado = m.puestoId;
      tabActual = 'registrar';
      render();
      window.scrollTo(0,0);
    };
  });
  const btnCancelarEdicion = document.getElementById('btn-cancelar-edicion');
  if(btnCancelarEdicion) btnCancelarEdicion.onclick = onCancelarEdicion;

  const btnReiniciar = document.getElementById('btn-reiniciar-calificaciones');
  if(btnReiniciar) btnReiniciar.onclick = reiniciarCalificaciones;

  document.querySelectorAll('[data-modo]').forEach(el=>{
    el.onclick = ()=>{ modoResultado = el.dataset.modo; render(); };
  });
  const inputFecha = document.getElementById('input-fecha-panorama');
  if(inputFecha) inputFecha.onchange = ()=>{ fechaPanorama = inputFecha.value; renderPanoramaFecha(); };
  document.querySelectorAll('[data-toggle-puesto]').forEach(el=>{
    el.onclick = ()=>{ const id = el.dataset.togglePuesto; colapsados[id] = !colapsados[id]; renderPanoramaFecha(); };
  });

  document.querySelectorAll('[data-periodo]').forEach(el=>{
    el.onclick = ()=>{ inicializarRangoGeneral(el.dataset.periodo); render(); };
  });
  const inputDesde = document.getElementById('general-desde');
  const inputHasta = document.getElementById('general-hasta');
  if(inputDesde) inputDesde.onchange = ()=>{ rangoGeneral.tipo='personalizado'; rangoGeneral.desde = inputDesde.value; renderTableroGeneral(); };
  if(inputHasta) inputHasta.onchange = ()=>{ rangoGeneral.tipo='personalizado'; rangoGeneral.hasta = inputHasta.value; renderTableroGeneral(); };
  const btnExportar = document.getElementById('btn-exportar-pdf');
  if(btnExportar) btnExportar.onclick = exportarTableroPDF;

  const btnGuardarLavado = document.getElementById('btn-guardar-lavado');
  if(btnGuardarLavado) btnGuardarLavado.onclick = onGuardarLavado;
  document.querySelectorAll('[data-modo-lavado]').forEach(el=>{
    el.onclick = ()=>{ filtroLavado.modo = el.dataset.modoLavado; render(); };
  });
  const lvFechaFiltro = document.getElementById('lv-fecha-filtro');
  if(lvFechaFiltro) lvFechaFiltro.onchange = ()=>{ filtroLavado.fecha = lvFechaFiltro.value; render(); };
  const lvPersonaFiltro = document.getElementById('lv-persona-filtro');
  if(lvPersonaFiltro) lvPersonaFiltro.onchange = ()=>{ filtroLavado.personaId = lvPersonaFiltro.value; render(); };
  document.querySelectorAll('[data-del-lavado]').forEach(el=>{
    el.onclick = ()=>onEliminarLavado(el.dataset.delLavado);
  });
}

async function onGuardarLavado(){
  const trabajadorId = document.getElementById('lv-persona').value;
  if(!trabajadorId){ mostrarToast('Selecciona quién lavó las canastas'); return; }
  const fecha = document.getElementById('lv-fecha').value || hoyISO();
  const cantidad = Number(document.getElementById('lv-cantidad').value || 0);
  if(!cantidad || cantidad<=0){ mostrarToast('Escribe la cantidad de canastas lavadas'); return; }
  const rechazos = Number(document.getElementById('lv-rechazos').value || 0);
  const observaciones = document.getElementById('lv-obs').value.trim();
  const nuevo = { id:'lv_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), fecha, trabajadorId, cantidad, rechazos, observaciones, creado:Date.now() };
  lavados.push(nuevo);
  const r = await guardarLavados();
  if(r.ok){ mostrarToast('✓ Lavado registrado'); }
  else { lavados = lavados.filter(l=>l.id!==nuevo.id); mostrarError(r.error); }
  render();
}

async function onEliminarLavado(id){
  if(!confirm('¿Eliminar este registro de lavado?')) return;
  const copia = lavados;
  lavados = lavados.filter(l=>l.id!==id);
  const r = await guardarLavados();
  if(!r.ok){ lavados = copia; mostrarError(r.error); }
  render();
}

async function onGuardarMuestreo(){
  const p = puestoPorId(puestoSeleccionado);
  const trabajadorId = document.getElementById('f-trabajador').value;
  if(!trabajadorId){ mostrarToast('Selecciona un trabajador'); return; }
  const fecha = document.getElementById('f-fecha').value || hoyISO();
  const valores = {};
  p.campos.forEach(c=>{
    const el = document.getElementById('f-'+c.key);
    valores[c.key] = el ? el.value : '';
  });
  const notas = document.getElementById('f-notas').value;

  if(editandoId){
    const idx = muestreos.findIndex(m=>m.id===editandoId);
    let copiaAnterior = null;
    let copiaLavados = lavados;
    if(idx>=0){
      copiaAnterior = muestreos[idx];
      muestreos[idx] = { ...muestreos[idx], trabajadorId, fecha, valores, notas, editado:Date.now() };
      sincronizarLavadoDesdeMuestreo(muestreos[idx]);
    }
    editandoId = null;
    const r = await guardarMuestreos();
    if(r.ok){ mostrarToast('✓ Registro actualizado'); }
    else { if(idx>=0) muestreos[idx] = copiaAnterior; lavados = copiaLavados; mostrarError(r.error); }
  }else{
    const nuevo = { id:uid(), puestoId:p.id, trabajadorId, fecha, valores, notas, creado:Date.now() };
    muestreos.push(nuevo);
    sincronizarLavadoDesdeMuestreo(nuevo);
    const r = await guardarMuestreos();
    if(r.ok){ mostrarToast('✓ Registro guardado'); }
    else { muestreos = muestreos.filter(m=>m.id!==nuevo.id); lavados = lavados.filter(l=>l.origenMuestreoId!==nuevo.id); mostrarError(r.error); }
  }
  render();
}

// Cuando se califica el puesto "Lavado de Canastas" en Registrar, refleja ese
// mismo dato automáticamente en el histórico de la pestaña "Lavado", sin
// necesidad de digitarlo dos veces. Se enlazan por origenMuestreoId.
function sincronizarLavadoDesdeMuestreo(m){
  if(m.puestoId !== 'lavado_canastas') return;
  const cantidad = Number(m.valores && m.valores.canastas_lavadas || 0);
  const rechazos = Number(m.valores && m.valores.rechazos || 0);
  const idxLav = lavados.findIndex(l=>l.origenMuestreoId===m.id);
  const registro = {
    id: idxLav>=0 ? lavados[idxLav].id : 'lv_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    fecha: m.fecha, trabajadorId: m.trabajadorId, cantidad, rechazos,
    observaciones: m.notas || '', creado: m.creado || Date.now(),
    origenMuestreoId: m.id
  };
  if(idxLav>=0) lavados[idxLav] = registro; else lavados.push(registro);
}

function onCancelarEdicion(){
  editandoId = null;
  render();
}

async function reiniciarCalificaciones(){
  if(!confirm(`Esto va a borrar los ${muestreos.length} registros de desempeño guardados hasta ahora. Los trabajadores NO se borran.\n\n¿Estás seguro?`)) return;
  if(!confirm('Última confirmación: esta acción no se puede deshacer. ¿Borrar todo el histórico de calificaciones?')) return;
  const copia = muestreos;
  muestreos = [];
  const r = await guardarMuestreos();
  if(r.ok){ mostrarToast('✓ Calificaciones reiniciadas'); }
  else { muestreos = copia; mostrarError(r.error); }
  render();
}

async function onEliminarMuestreo(id){
  if(!confirm('¿Eliminar este registro del historial?')) return;
  const copia = muestreos;
  const copiaLavados = lavados;
  muestreos = muestreos.filter(m=>m.id!==id);
  lavados = lavados.filter(l=>l.origenMuestreoId!==id);
  const r = await guardarMuestreos();
  if(!r.ok){ muestreos = copia; lavados = copiaLavados; mostrarError(r.error); }
  render();
}

async function onAgregarTrabajador(){
  const nombre = document.getElementById('nuevo-nombre').value.trim();
  if(!nombre){ mostrarToast('Escribe un nombre'); return; }
  const sexo = document.getElementById('nuevo-sexo').value;
  const nuevo = { id:'t_'+Date.now(), nombre, sexo };
  trabajadores.push(nuevo);
  const r = await guardarTrabajadores();
  if(r.ok){ mostrarToast('✓ Trabajador agregado'); }
  else { trabajadores = trabajadores.filter(t=>t.id!==nuevo.id); mostrarError(r.error); }
  render();
}

async function onEliminarTrabajador(id){
  if(!confirm('¿Eliminar este trabajador? Sus registros quedarán sin nombre asociado.')) return;
  const copia = trabajadores;
  trabajadores = trabajadores.filter(t=>t.id!==id);
  const r = await guardarTrabajadores();
  if(!r.ok){ trabajadores = copia; mostrarError(r.error); }
  render();
}

  b.addEventListener('click', ()=>{ tabActual = b.dataset.tab; render(); });
